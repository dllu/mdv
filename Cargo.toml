[package]
name = "mdv"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast terminal viewer for CommonMark / GitHub-flavored Markdown"
repository = "https://github.com/dllu/mdv"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
terminal_size = "0.4.4"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
